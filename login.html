<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login or sign up</title>
  <link rel="stylesheet" href="style2.css" />
</head>
<body>
  <header>
    <div class="logo">JOURNEY</div>
    <div class="header-right">
      <div class="icons">
        <img src="ic_calendar.png" alt="calendar" class="icon">
        <img src="ic_forum.png" alt="forum" class="icon">
        <img src="ic_journey.png" alt="journey" class="icon">
      </div>
      <img src="line.png" alt="|" class="line">
      <div class="auth">
        Welcome, <a href="#">Log In</a> or <a href="#">Sign Up</a>
      </div>
    </div>
  </header>

  <div class="modal">
    <div class="modal-header">
      <img src="shape.png" alt="shape" class="shape">
      <h2>Sign Up</h2>
    </div>
    <div class="social-login">
      <button class="social-btn facebook">Facebook</button>
      <button class="social-btn google">Google</button>
    </div>
    <div class="or">or</div>
    <input type="text" placeholder="First Name" value="Jason">
    <input type="text" placeholder="Last Name">
    <input type="text" placeholder="Email">
    <input type="password" placeholder="Choose Password">
    <input type="password" placeholder="Confirm Password">
    <div class="checkbox">
      <input type="checkbox" id="agree" checked>
      <label for="agree">Agree our <a href="#">Terms & Conditions</a></label>
    </div>
    <button class="create-account">Create Account</button>
  </div>
</body>
</html>
